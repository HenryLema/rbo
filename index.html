<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Basura Otavalo</title>

  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://recolectorbasuraotavalo-default-rtdb.firebaseio.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://a.tile.openstreetmap.org">
  <link rel="dns-prefetch" href="https://b.tile.openstreetmap.org">
  <link rel="dns-prefetch" href="https://c.tile.openstreetmap.org">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      box-shadow: none !important;
      text-shadow: none !important;
      -webkit-box-shadow: none !important;
      filter: none !important;
      -webkit-filter: none !important;
      border: none !important;
      border-color: transparent !important;
    }

    html, body {
      height: 100%; width: 100%;
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #map { position: fixed; inset: 0; z-index: 0; }

    #top {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: clamp(4px,1.5vw,8px) clamp(6px,2vw,12px);
      background: transparent;
      pointer-events: none;
    }
    #top > * { pointer-events: auto; }

    #topRow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(4px,1.2vw,7px);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      height: clamp(26px,5vw,34px);
      padding: 0 clamp(6px,1.8vw,11px);
      border-radius: 10px;
      font-size: clamp(10px,1.8vw,12px);
      background: rgba(255,255,255,.88);
      white-space: nowrap;
      line-height: 1;
      cursor: default;
      user-select: none;
    }

    button.chip {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    button.chip:active { background: rgba(210,210,210,.95); }
    button.chip:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .title-chip {
      height: auto;
      min-height: clamp(26px,5vw,34px);
      padding: clamp(3px,1vw,5px) clamp(6px,1.8vw,11px);
      white-space: normal;
      word-break: break-word;
      line-height: 1.25;
      max-width: 100%;
    }

    .busstate-pill {
      display: inline-block;
      padding: 1px clamp(5px,1.5vw,8px);
      border-radius: 8px;
      color: #fff;
      font-size: clamp(10px,1.8vw,12px);
      line-height: 1.4;
    }
    .busstate-pill.moving  { background: #008000; }
    .busstate-pill.stopped { background: #cc0000; }

    .bus-arrow { width: 30px; height: 30px; }
    .bus-arrow.moving  { color: #008000; }
    .bus-arrow.stopped { color: #cc0000; }
    .bus-arrow.nosnap  { opacity: .45; }

    .stop-icon {
      font-size: clamp(22px,4vw,32px);
      transform: translate(-50%,-50%);
      display: block; line-height: 1;
    }

    #map.draw-mode { cursor: crosshair !important; }

    #drawHint {
      position: fixed;
      bottom: clamp(60px,10vw,80px);
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.62);
      color: #fff;
      font-size: clamp(11px,2vw,13px);
      padding: 5px 14px;
      border-radius: 10px;
      z-index: 1500;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    #toast {
      position: fixed;
      bottom: clamp(60px,10vw,80px);
      left: 50%; transform: translateX(-50%);
      background: rgba(30,30,30,0.88);
      color: #fff;
      font-size: clamp(11px,2vw,13px);
      padding: 7px 18px;
      border-radius: 12px;
      z-index: 3000;
      pointer-events: none;
      display: none;
      text-align: center;
      max-width: 90vw;
      white-space: normal;
    }

    .solicitud-ring { width:52px; height:52px; border-radius:50%; position:absolute; transform:translate(-50%,-50%); opacity:.3; pointer-events:none; }
    .solicitud-core { width:22px; height:22px; border-radius:50%; position:absolute; transform:translate(-50%,-50%); opacity:.9; cursor:pointer; }
    .solicitud-timer {
      position: absolute;
      top: -18px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff; font-size: 10px;
      font-family: Arial, sans-serif;
      padding: 1px 5px; border-radius: 6px;
      white-space: nowrap; pointer-events: none;
    }

    .leaflet-bar, .leaflet-bar a,
    .leaflet-touch .leaflet-bar, .leaflet-touch .leaflet-bar a,
    .leaflet-control-attribution { border: none !important; }
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #fff !important;
      color: #000 !important;
    }
    .leaflet-popup-close-button {
      display: block !important;
      visibility: visible !important;
      top: 3px !important; right: 3px !important;
      width: 24px !important; height: 24px !important;
      font: 20px/24px Arial, sans-serif !important;
      text-align: center !important;
      padding: 0 !important;
      color: #666 !important;
      z-index: 10;
      touch-action: manipulation;
    }
    .leaflet-popup-close-button:hover,
    .leaflet-popup-close-button:active { color: #000 !important; background: transparent !important; }
    .leaflet-marker-shadow { display: none !important; }
    .leaflet-popup-content { font-family: Arial,sans-serif !important; font-weight: normal !important; }
    .leaflet-marker-icon      { filter: none !important; -webkit-filter: none !important; }
    .leaflet-zoom-animated    { filter: none !important; -webkit-filter: none !important; }
    .leaflet-shadow-pane      { display: none !important; }
    .leaflet-marker-pane img  { filter: none !important; -webkit-filter: none !important; }

    .leaflet-top.leaflet-left  { display: none; }
    .leaflet-bottom.leaflet-right {
      bottom: clamp(12px,3vw,24px);
      right:  clamp(8px,2vw,14px);
    }

    .popup-wrap      { width: clamp(130px,35vw,170px); font-family: Arial,sans-serif; }
    .stop-popup-wrap { width: clamp(140px,38vw,180px); font-family: Arial,sans-serif; }

    .popup-title, .popup-line,
    .stop-popup-title, .stop-popup-line {
      display: block; color: #000; font-weight: normal;
      font-size: clamp(10px,2vw,12px); line-height: 1.3; margin: 3px 0;
    }
    .popup-title, .stop-popup-title { text-align: center; margin: 0 0 5px; }
    .popup-val { font-weight: normal; }
    .popup-val.moving  { color: #008000; }
    .popup-val.stopped { color: #cc0000; }

    #infoOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.28);
      display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: clamp(8px,3vw,20px);
    }
    #infoModal {
      width: 100%;
      max-width: min(780px, calc(100vw - 16px));
      max-height: calc(100vh - 32px);
      overflow-y: auto; background: #fff;
      border-radius: clamp(10px,2vw,16px);
      padding: clamp(8px,2vw,14px) clamp(10px,2.5vw,16px);
      font-family: Arial,sans-serif; font-size: clamp(11px,1.8vw,13px);
      color: #000; -webkit-overflow-scrolling: touch;
    }
    #infoTopRow {
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 10px; margin-bottom: clamp(6px,1.5vw,10px);
    }
    #infoTitle  { font-size: clamp(11px,1.8vw,13px); font-weight: normal; opacity: .9; }
    #infoClose  {
      width: 28px; height: 28px; padding: 0;
      background: transparent; color: #666;
      font: 22px/28px Arial, sans-serif; text-align: center;
      cursor: pointer; user-select: none; flex-shrink: 0;
      touch-action: manipulation;
    }
    #infoGrid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(8px,2vw,14px);
    }
    @media (max-width:480px) { #infoGrid { grid-template-columns: 1fr; } }
    .infoCol {
      border-radius: clamp(8px,1.5vw,12px);
      padding: clamp(7px,1.5vw,11px); background: #fff;
    }
    .infoColTitle {
      text-align: center; font-size: clamp(11px,1.8vw,13px);
      font-weight: normal; margin: 0 0 7px;
    }
    .infoLine {
      font-size: clamp(10px,1.7vw,12px); font-weight: normal; margin: 3px 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    #map, .chip, .stop-icon { touch-action: manipulation; }
  </style>
</head>

<body>
  <div id="top">
    <div id="topRow">
      <div class="chip title-chip">♻️ Recolector Basura Otavalo</div>
      <div class="chip">⏱️ Hora: <span id="hora" style="margin-left:3px">--</span></div>
      <div class="chip">🚦 Estado:&nbsp;<span id="busState" class="busstate-pill stopped">Detenido</span></div>
      <button id="btnReload"      class="chip">🔄 Recargar</button>
      <button id="btnRestart"     class="chip">🔁 Reset ESP32</button>
      <button id="btnToggleTrail" class="chip">🟢 Recorrido: Si</button>
      <button id="btnInfo"        class="chip">ℹ️ Info</button>
      <button id="btnDibujar"     class="chip">📊 Calcular</button>
    </div>
  </div>

  <div id="map"></div>
  <div id="drawHint">👇 Agregar Punto</div>
  <div id="toast"></div>

  <div id="infoOverlay" aria-hidden="true">
    <div id="infoModal" role="dialog" aria-modal="true">
      <div id="infoTopRow">
        <div id="infoTitle">📱 Tiempo Real</div>
        <button id="infoClose" aria-label="Cerrar">×</button>
      </div>
      <div id="infoGrid">
        <div class="infoCol">
          <div class="infoColTitle">🚚 Recolector</div>
          <div id="infoMovil"></div>
        </div>
        <div class="infoCol">
          <div class="infoColTitle">📊 Central</div>
          <div id="infoFijo"></div>
        </div>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, onValue, set, push,
         remove, serverTimestamp, goOffline, goOnline } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

// ─── Toast ────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg, durationMs=4000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display="none"; }, durationMs);
}

// ─── Identificador de usuario ─────────────────────────────────
function getUserId() {
  let uid = localStorage.getItem("rbo_uid");
  if(!uid) {
    uid = "u_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    localStorage.setItem("rbo_uid", uid);
  }
  return uid;
}
const MY_UID = getUserId();

// ─── Firebase ─────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyCZP36RLL7SEWvyLApKKFJzjjssNRe-_LE",
  authDomain:        "recolectorbasuraotavalo.firebaseapp.com",
  databaseURL:       "https://recolectorbasuraotavalo-default-rtdb.firebaseio.com",
  projectId:         "recolectorbasuraotavalo",
  storageBucket:     "recolectorbasuraotavalo.firebasestorage.app",
  messagingSenderId: "900064792007",
  appId:             "1:900064792007:web:c88637de46577aed87dde2"
};
const db = getDatabase(initializeApp(firebaseConfig));

// ─── Conectividad (móviles / portátiles) ──────────────────────
let fbConnected = false, wasDisconnected = false, _offTimer = null, _hiddenAt = 0;
onValue(ref(db, ".info/connected"), snap => {
  fbConnected = snap.val() === true;
  if(fbConnected){
    clearTimeout(_offTimer); _offTimer = null;
    if(wasDisconnected){ wasDisconnected = false; showToast("✅ Conexión restablecida", 2500); }
  } else if(!_offTimer){
    _offTimer = setTimeout(() => {
      _offTimer = null;
      if(!fbConnected){ wasDisconnected = true; showToast("📡 Sin conexión, reconectando…", 6000); }
    }, 5000);
  }
});
function reconectar(force){
  if(fbConnected && !force) return;
  try { goOffline(); goOnline(); } catch(e) {}
}
window.addEventListener("online", () => reconectar(false));
window.addEventListener("pageshow", e => { if(e.persisted) reconectar(true); });
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ _hiddenAt = Date.now(); return; }
  reconectar(Date.now() - _hiddenAt > 60000);
});

// ─── Mapa ─────────────────────────────────────────────────────
const map = L.map("map", {
  zoomControl:false, tap:true, tapTolerance:15, preferCanvas:true,
  zoomAnimation:false, fadeAnimation:false, markerZoomAnimation:false
}).setView([0.23299010950077462,-78.26316758796887],14);

L.Popup.mergeOptions({closeButton:true});
L.control.zoom({position:"bottomright"}).addTo(map);
map.attributionControl.setPrefix("🪐 Red Otavalo");
const _conn = navigator.connection || {};
const _slowNet = !!_conn.saveData || /(^|slow-)2g|3g/.test(_conn.effectiveType || "");
const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19, detectRetina:!_slowNet, updateWhenZooming:false, updateWhenIdle:true, keepBuffer:_slowNet?1:2
}).addTo(map);
tiles.on("tileerror", e => {
  const t = e.tile;
  t._retry = (t._retry || 0) + 1;
  if(t._retry > 2) return;
  setTimeout(() => { if(t.isConnected && navigator.onLine !== false) t.src = t.src; }, 1500 * t._retry);
});

map.on("popupopen", e =>
  setTimeout(()=>{ if(map.hasLayer(e.popup)) map.closePopup(e.popup); },60000)
);

// ─── Recargar ─────────────────────────────────────────────────
document.getElementById("btnReload").addEventListener("click", async () => {

  location.reload();   // solo recarga la página (ya NO reinicia el ESP32)
});
// Reinicio remoto del ESP32 (equivale a pulsar RESET). Segundos (no ms) para caber en int de 32 bits del ESP32
document.getElementById("btnRestart").addEventListener("click", () => {
  if(!fbConnected) return;   // sin conexión no se encola la orden (evita reinicios tardíos)
  set(ref(db,"Control/restart_ts"), Math.floor(Date.now()/1000)).catch(()=>{});   // segundos: cabe en int de 32 bits del ESP32
});

// ─── Info modal ───────────────────────────────────────────────
const infoOverlay = document.getElementById("infoOverlay");
const infoMovilEl = document.getElementById("infoMovil");
const infoFijoEl  = document.getElementById("infoFijo");
let infoOpen=false, latestFijoData=null, latestBusData=null;

const safeNum    = (v,d=6) => { const n=Number(v); return isFinite(n)?n.toFixed(d):"--"; };
const safeVal    = v => (v===undefined||v===null||v===""||
                         (typeof v==="number"&&!isFinite(v)))?"--":String(v);
const makeLines  = a => a.map(t=>`<div class="infoLine">${t}</div>`).join("");
const boolToSiNo = v => {
  if(v===true||v==="true"||v==="TRUE"||v==="True")    return "Si";
  if(v===false||v==="false"||v==="FALSE"||v==="False") return "No";
  return "--";
};

function renderInfo() {
  const m=latestBusData||{}, f=latestFijoData||{};
  const movilVel=(m.speed_kmh!==undefined&&isFinite(Number(m.speed_kmh)))
    ?`${Number(m.speed_kmh).toFixed(1)} km/h`:"--";
  const altRaw=[m.altura,m.alt,m.altitud,m.altitude,m.alt_m,m.altura_m]
    .find(v=>v!==undefined&&v!==null&&v!==""&&isFinite(Number(v)));
  const movilAlt=altRaw!==undefined?`${Number(altRaw).toFixed(1)} m`:"--";
  infoMovilEl.innerHTML=makeLines([
    `⏱️ Hora: ${safeVal(m.hora_ecuador)}`,
    `📍 Latitud: ${m.lat!==undefined?safeNum(m.lat,6):"--"}`,
    `📍 Longitud: ${m.lon!==undefined?safeNum(m.lon,6):"--"}`,
    `⛰️ Altura: ${movilAlt}`,
    `🛰️ Satélites: ${safeVal(m.satelites)}`,
    `🚀 Velocidad: ${movilVel}`,
    `🎯 Precisión: ${safeVal(m.hdop)}`
  ]);
  let fijoFlag="--";
  if(f.fijo_ok!==undefined) fijoFlag=boolToSiNo(f.fijo_ok);
  else if(f.fix!==undefined) fijoFlag=boolToSiNo(f.fix);
  infoFijoEl.innerHTML=makeLines([
    `⏱️ Hora: ${safeVal(f.hora_ecuador)}`,
    `📍 Latitud: ${f.lat!==undefined?safeNum(f.lat,6):"--"}`,
    `📍 Longitud: ${f.lon!==undefined?safeNum(f.lon,6):"--"}`,
    `🛰️ Satélites: ${safeVal(f.satelites)}`,
    `⚓ Fijo: ${fijoFlag}`,
    `🎯 Precisión: ${safeVal(f.hdop)}`
  ]);
}
function openInfo()  {infoOpen=true;  renderInfo(); infoOverlay.style.display="flex";  infoOverlay.setAttribute("aria-hidden","false"); }
function closeInfo() {infoOpen=false; infoOverlay.style.display="none"; infoOverlay.setAttribute("aria-hidden","true"); }

document.getElementById("btnInfo").addEventListener("click",  e=>{ e.preventDefault(); openInfo(); });
document.getElementById("infoClose").addEventListener("click", closeInfo);
infoOverlay.addEventListener("click", e=>{ if(e.target===infoOverlay) closeInfo(); });
window.addEventListener("keydown", e=>{ if(e.key==="Escape"&&infoOpen) closeInfo(); });

// ─── Iconos bus/parada ────────────────────────────────────────
const stopIcon = L.divIcon({
  className:"", html:'<span class="stop-icon">🚮</span>',
  iconSize:[36,36], iconAnchor:[18,18]
});
const BUS_ICON=L.divIcon({
  className:"",
  html:'<div class="bus-arrow stopped"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 1L21 22L12 17L3 22Z" fill="currentColor" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>',
  iconSize:[30,30], iconAnchor:[15,15]
});
let busIsMoving=false;
const busMarker=L.marker([0,0],{icon:BUS_ICON,opacity:0}).addTo(map);   // oculta hasta tener posición ajustada a calle

function buildBusPopupHtml(speedKmh,isMoving) {
  return `<div class="popup-wrap">
    <span class="popup-title">🚚 Recolector</span>
    <span class="popup-line">🚀 Velocidad: <span class="popup-val ${isMoving?"moving":"stopped"}">${Number(speedKmh||0).toFixed(1)} km/h</span></span>
    <span class="popup-line">🚦 Estado: <span class="popup-val ${isMoving?"moving":"stopped"}">${isMoving?"Movimiento":"Detenido"}</span></span>
  </div>`;
}
busMarker.bindPopup(buildBusPopupHtml(0,false));
busMarker.on("popupopen",()=>{pauseFollowFor(); });

// ─── Auto-follow ──────────────────────────────────────────────
const FOLLOW_RESUME_MS=60000;
let followEnabled=true, followTimer=null, lastLatLng=null;
// Los movimientos hechos por el propio código NO deben pausar el seguimiento
let progMove=false, progTimer=null;
function progView(fn){ progMove=true; try{ fn(); } finally { progMove=false; } }   // eventos síncronos (sin animación)
function pauseFollowFor(ms=FOLLOW_RESUME_MS) {
  followEnabled=false;
  if(followTimer) clearTimeout(followTimer);
  followTimer=setTimeout(()=>{
    followEnabled=true;
    if(lastLatLng) progView(()=>map.setView(lastLatLng,map.getZoom(),{animate:false}));
  },ms);
}
const _userMove=()=>{ if(!progMove) pauseFollowFor(); };
map.on("zoomstart",_userMove);
map.on("zoom",     _userMove);
map.on("dragstart",()=>{ if(!drawMode) pauseFollowFor(); });
map.on("movestart",_userMove);

// ─── Ruta verde ───────────────────────────────────────────────
let trailLatLngs=[], committed=0;
const trailSegs=[trailLatLngs], MAX_POINTS=1500;
// Línea entrecortada y ancha como la calle; el grosor se ajusta al zoom (styleTrail)
const TRAIL_STYLE={color:"green",weight:6,opacity:0.85,dashArray:"9 6",lineCap:"butt",lineJoin:"round",interactive:false};
const TRAIL_KEY="rbo_trail_v6", TRAIL_MAX_AGE_MS=60*60*1000;
try{
  const sv=JSON.parse(localStorage.getItem(TRAIL_KEY)||"null"), segs=[];
  if(sv&&Array.isArray(sv.s)&&Date.now()-sv.t<=TRAIL_MAX_AGE_MS)
    sv.s.forEach(sg=>{ if(!Array.isArray(sg)) return; const a=sg.filter(q=>Array.isArray(q)&&isFinite(q[0])&&isFinite(q[1])); if(a.length>1) segs.push(a); });
  if(segs.length){ trailSegs.length=0; segs.forEach(a=>trailSegs.push(a)); trailLatLngs=[]; trailSegs.push(trailLatLngs); }
}catch(e){}
const trailLine=L.polyline(trailSegs.filter(s=>s.length>1),TRAIL_STYLE).addTo(map);
const trailHead=L.polyline([],TRAIL_STYLE).addTo(map);
let _trailDirty=false;
setInterval(()=>{
  if(!_trailDirty) return;
  _trailDirty=false;
  try{
    let n=0; const out=[];
    for(let i=trailSegs.length-1;i>=0&&n<1200;i--){
      const sg=trailSegs[i].slice(-(1200-n));
      if(sg.length>1){ out.unshift(sg.map(q=>[+q[0].toFixed(6),+q[1].toFixed(6)])); n+=sg.length; }
    }
    localStorage.setItem(TRAIL_KEY,JSON.stringify({t:Date.now(),s:out}));
  }catch(e){}
},15000);
let trailVisible=true;
function renderTrail(){ if(trailVisible) trailLine.setLatLngs(trailSegs.filter(sg=>sg.length>1)); }
function styleTrail(){   // grosor ≈ ancho de una calzada (8 m) según el zoom
  const z=map.getZoom(), lat=lastLatLng?lastLatLng[0]:0.23;
  const w=Math.max(4,Math.min(30,8/(156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,z))));
  const st={weight:w,dashArray:`${Math.max(8,w*1.5).toFixed(0)} ${Math.max(5,w*0.8).toFixed(0)}`};
  trailLine.setStyle(st); trailHead.setStyle(st);
}
map.on("zoomend",styleTrail); styleTrail();

document.getElementById("btnToggleTrail").addEventListener("click",e=>{
  trailVisible=!trailVisible;

// ─── Util ─────────────────────────────────────────────────────
function haversineMeters(lat1,lon1,lat2,lon2) {
  const R=6371000,toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatDist(m) {
  if(!isFinite(m)||m<=0) return "--";
  return (m<1000)?`${m.toFixed(0)} m`:`${(m/1000).toFixed(2)} km`;
}
function formatETA(sec) {
  if(!isFinite(sec)||sec<=0) return "--";
  const m=Math.round(sec/60);
  if(m<1)  return "< 1 min";
  if(m<60) return `${m} min`;
  return `${Math.floor(m/60)} h ${m%60} min`;
}
const ema  = (p,x,a) => p==null?x:a*x+(1-a)*p;
const ema2 = (p,x,a) => !p?x:[ema(p[0],x[0],a),ema(p[1],x[1],a)];

// ─── ETA ──────────────────────────────────────────────────────
const ROUTE_FACTOR=1.45,ETA_BIAS_SEC=45,DEFAULT_SPEED_KMH=4.5;
const SPEED_ALPHA=0.15,MIN_USABLE_SPEED_KMH=2.0,MAX_REASONABLE_SPEED_KMH=55;
let speedSmoothed=null,lastGoodSpeed=null;

function pickSpeedKmh(rawSpeedKmh) {
  let s=Number(rawSpeedKmh||0);
  if(!isFinite(s)||s<0) s=0;
  if(s>MAX_REASONABLE_SPEED_KMH) s=MAX_REASONABLE_SPEED_KMH;
  speedSmoothed=ema(speedSmoothed,s,SPEED_ALPHA);
  if(isFinite(speedSmoothed)&&speedSmoothed>=MIN_USABLE_SPEED_KMH) lastGoodSpeed=speedSmoothed;
  if(isFinite(speedSmoothed)&&speedSmoothed>=MIN_USABLE_SPEED_KMH) return speedSmoothed;
  if(isFinite(lastGoodSpeed)&&lastGoodSpeed>=MIN_USABLE_SPEED_KMH) return lastGoodSpeed;
  return DEFAULT_SPEED_KMH;
}
function calcEtaSeconds(distStraightM,usedSpeedKmh) {
  return (distStraightM*ROUTE_FACTOR/Math.max(usedSpeedKmh/3.6,0.1))+(distStraightM<30?0:ETA_BIAS_SEC);
}

// ─── Ajuste a calles (OSRM match): flecha y línea SOLO sobre calles de OpenStreetMap ───
const GRAPH_MS=500;                         // la página grafica forzado cada 0.5 s
const MOVING_KMH=2.0, STOPPED_SPEED_KMH=3.0;
const WIN_MIN_DIST=8, WIN_MAX=12, WIN_KEEP=8, WIN_HARD=30;
const _netSlowNow=()=>{ const c=navigator.connection||{}; return !!c.saveData||/(^|slow-)2g|3g/.test(c.effectiveType||""); };
const _kx=lat=>111320*Math.cos(lat*Math.PI/180), _ky=110574;
const win=[];                               // puntos GPS recientes para el map matching
let trailFrozen=false, slowSince=0, fastSince=0, prevCourse=null, turnUntil=0, lastDataAt=0;
let winDirty=false, matchPending=false, lastMatchAt=0, matchFails=0, matchRej=0, matchPausedUntil=0;
let snapPos=null, snapHdg=null, snapExt=false, lastSnapOkAt=0, arrowShown=false;
let nearestPending=false, lastNearestAt=0, nearestNoBrg=false;

function projSeg(p,a,b){                    // proyección de p sobre el segmento a–b
  const kx=_kx(a[0]), px=(p[1]-a[1])*kx, py=(p[0]-a[0])*_ky, bx=(b[1]-a[1])*kx, by=(b[0]-a[0])*_ky;
  const l2=bx*bx+by*by, t=l2?(px*bx+py*by)/l2:0, tc=Math.max(0,Math.min(1,t));
  return {t, d:Math.hypot(px-tc*bx,py-tc*by), pt:[a[0]+(b[0]-a[0])*tc, a[1]+(b[1]-a[1])*tc]};
}
function bearingDeg(a,b){
  const r=Math.PI/180, y=Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r),
        x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);
  return Math.round((Math.atan2(y,x)/r+360)%360);
}
// Posición del vehículo SOBRE el trazo ya ajustado a calle (local, sin red) y rumbo del tramo
function snapToTrail(p){
  const n=trailLatLngs.length; if(n<2) return null;
  let bi=-1, br=null;
  for(let i=Math.max(0,n-80); i<n-1; i++){
    const r=projSeg(p,trailLatLngs[i],trailLatLngs[i+1]);
    if(!br||r.d<=br.d+0.5){ br=r; bi=i; }   // a igualdad, el tramo más adelantado
  }
  const a=trailLatLngs[bi], b=trailLatLngs[bi+1], hdg=bearingDeg(a,b);
  if(bi===n-2&&br.t>1){                     // ya pasó el final del trazo: se prolonga por la calle (máx. 40 m)
    const kx=_kx(b[0]), ux=(b[1]-a[1])*kx, uy=(b[0]-a[0])*_ky, ul=Math.hypot(ux,uy)||1;
    const wx=(p[1]-b[1])*kx, wy=(p[0]-b[0])*_ky, along=(wx*ux+wy*uy)/ul, lat=Math.abs(wx*uy-wy*ux)/ul;
    if(lat>20||along<=0) return {pt:b,hdg,ext:false};
    const L=Math.min(along,40);
    return {pt:[b[0]+uy/ul*L/_ky, b[1]+ux/ul*L/kx], hdg, ext:true};
  }
  if(br.d>35) return null;
  return {pt:br.pt,hdg,ext:false};
}
function placeArrow(){
  if(!snapPos) return;
  busMarker.setLatLng(snapPos);
  if(!arrowShown){ busMarker.setOpacity(1); arrowShown=true; }
  const el=busMarker.getElement(), ar=el&&el.firstChild;
  if(ar&&snapHdg!==null) ar.style.transform=`rotate(${snapHdg}deg)`;
}
// Primera posición (o sin trazo): calle más cercana, con el rumbo si se conoce
async function nearestOnce(p,course){
  nearestPending=true; const t0=lastNearestAt=Date.now();
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),4000);
  try{
    const br=(!nearestNoBrg&&isFinite(course)&&course>=0)?`&bearings=${Math.round(course)%360},90`:"";
    const r=await fetch(`https://router.project-osrm.org/nearest/v1/driving/${p[1].toFixed(6)},${p[0].toFixed(6)}?number=1${br}`,{signal:ac.signal});
    const j=await r.json(), loc=j&&j.waypoints&&j.waypoints[0]&&j.waypoints[0].location;
    if(!loc){ if(br) nearestNoBrg=true; return; }
    const q=[loc[1],loc[0]];
    if(lastSnapOkAt<t0&&haversineMeters(p[0],p[1],q[0],q[1])<=40){
      snapPos=q; snapExt=false; if(isFinite(course)&&course>=0) snapHdg=course;
      lastSnapOkAt=Date.now(); placeArrow();
    }
  }catch(e){} finally{ clearTimeout(to); nearestPending=false; }
}
// Map matching: ajusta los últimos puntos GPS a la red de calles (HMM de OSRM)
async function matchWindow(pts){
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),5000);
  try{
    const cs=pts.map(q=>q[1].toFixed(6)+","+q[0].toFixed(6)).join(";"), rd=pts.map(()=>25).join(";");
    const r=await fetch(`https://router.project-osrm.org/match/v1/driving/${cs}?overview=full&geometries=geojson&gaps=ignore&radiuses=${rd}`,{signal:ac.signal});
    const j=await r.json();
    if(j.code!=="Ok"||!j.matchings||!j.matchings.length) return null;   // NoMatch: calle fuera de OSM o GPS muy lejos
    const g=[]; j.matchings.forEach(m=>m.geometry.coordinates.forEach(c=>g.push([c[1],c[0]])));
    return g.length>1?g:null;
  } finally { clearTimeout(to); }
}
function pathLen(a){ let l=0; for(let i=1;i<a.length;i++) l+=haversineMeters(a[i-1][0],a[i-1][1],a[i][0],a[i][1]); return l; }
function validMatch(g,pts){
  const e=g[g.length-1], l=pts[pts.length-1];
  return haversineMeters(e[0],e[1],l[0],l[1])<=40 && pathLen(g)<=pathLen(pts)*2+60;
}
function newSeg(){
  trailLatLngs=[]; trailSegs.push(trailLatLngs); committed=0;
  if(trailSegs.length>30) trailSegs.shift();
}
// La cola del trazo se REESCRIBE en cada ajuste (corrige giros bruscos); lo anterior queda fijo
function applyMatch(g){
  const G=[g[0]];
  for(let i=1;i<g.length;i++){ const q=G[G.length-1]; if(haversineMeters(q[0],q[1],g[i][0],g[i][1])>0.5) G.push(g[i]); }
  if(G.length<2) return;
  if(committed>0){ const a=trailLatLngs[committed-1]; if(haversineMeters(a[0],a[1],G[0][0],G[0][1])>80) newSeg(); }   // hueco: no se une con recta
  trailLatLngs.length=committed;
  for(const q of G) trailLatLngs.push(q);
  if(win.length>WIN_MAX){                   // la ventana avanza: lo que quedó atrás se fija
    const drop=win.length-WIN_KEEP, f=win[drop]; win.splice(0,drop);
    let bi=0, bd=1e9;
    for(let i=0;i<G.length-1;i++){ const d=projSeg(f,G[i],G[i+1]).d; if(d<bd){ bd=d; bi=i; } }
    committed+=bi+1;
  }
  const ex=trailLatLngs.length-MAX_POINTS;
  if(ex>0){ trailLatLngs.splice(0,ex); committed=Math.max(0,committed-ex); }
  _trailDirty=true; renderTrail();
}
function maybeMatch(now){
  if(matchPending||!winDirty||win.length<2||navigator.onLine===false||now<matchPausedUntil) return;
  const gap=_netSlowNow()?5000:(now<turnUntil?800:1500);   // en curvas se ajusta más seguido
  if(now-lastMatchAt<gap) return;
  matchPending=true; winDirty=false; lastMatchAt=now;
  const pts=win.slice();
  matchWindow(pts).then(g=>{
    matchFails=0;
    if(g&&validMatch(g,pts)){ matchRej=0; applyMatch(g); }
    else if(++matchRej>=5){ matchRej=0; win.splice(0,Math.max(0,win.length-3)); }
  }).catch(()=>{ winDirty=true; if(++matchFails>=4){ matchFails=0; matchPausedUntil=Date.now()+30000; } })
    .finally(()=>{ matchPending=false; });
}

// ✅ Cada tick (0.5 s): ventana GPS → ajuste a calle → flecha y línea siempre sobre la calle
function updateGreenTrailForced(rawLat, rawLon, speedKmh){
  const p=[rawLat,rawLon], now=Date.now(), c=Number(latestBusData&&latestBusData.course_deg);
  speedKmh=Number(speedKmh||0);
  const slow=speedKmh<STOPPED_SPEED_KMH;
  if(slow){ fastSince=0; if(!slowSince) slowSince=now; } else { slowSince=0; if(!fastSince) fastSince=now; }
  const lw=win.length?win[win.length-1]:null, dW=lw?haversineMeters(lw[0],lw[1],rawLat,rawLon):0;
  const dS=snapPos?haversineMeters(snapPos[0],snapPos[1],rawLat,rawLon):0;
  if(slowSince&&now-slowSince>=4000) trailFrozen=true;
  if(trailFrozen&&((fastSince&&now-fastSince>=1000)||dW>25||dS>25)) trailFrozen=false;
  if(isFinite(c)&&c>=0&&speedKmh>=5){
    if(prevCourse!==null&&Math.abs(((c-prevCourse+540)%360)-180)>8) turnUntil=now+2500;
    prevCourse=c;
  }
  if(lw&&dW>300) win.length=0;              // salto/hueco grande: ventana nueva
  if(!trailFrozen&&!(slow&&dW<35)){         // en reposo no se agregan puntos (sin rayas)
    const l2=win.length?win[win.length-1]:null;
    if(!l2||haversineMeters(l2[0],l2[1],rawLat,rawLon)>=WIN_MIN_DIST){ win.push(p); winDirty=true; if(win.length>WIN_HARD) win.shift(); }
  }
  if(!trailFrozen||!snapPos){
    const s=snapToTrail(p);
    if(s){ snapPos=s.pt; snapHdg=s.hdg; snapExt=s.ext; lastSnapOkAt=now; placeArrow(); }
    else{
      snapExt=false;
      if(!nearestPending&&now-lastNearestAt>1200&&navigator.onLine!==false) nearestOnce(p,speedKmh>=8?c:-1);
    }
  }
  maybeMatch(now);
  const end=trailLatLngs.length?trailLatLngs[trailLatLngs.length-1]:null;
  if(trailVisible) trailHead.setLatLngs(end&&snapPos&&snapExt&&haversineMeters(end[0],end[1],snapPos[0],snapPos[1])<80?[end,snapPos]:[]);
  const el=busMarker.getElement(), ar=el&&el.firstChild;
  if(ar) ar.classList.toggle("nosnap",now-lastSnapOkAt>10000||now-lastDataAt>15000);   // opaca = sin ajuste/sin datos recientes
}

  return buildStopPopupHtml(t,formatETA(calcEtaSeconds(d,i.usedSpeedKmh)),formatDist(d),`${i.usedSpeedKmh.toFixed(1)} km/h`);
}
function solicitudPopupHtml(k,esMio,color,lat,lon){
  const i=lastBusInfo;
  if(!i) return buildSolicitudPopupHtml(k,esMio,color);
  const d=haversineMeters(i.lat,i.lon,lat,lon);
  return buildSolicitudPopupHtml(k,esMio,color,formatETA(calcEtaSeconds(d,i.usedSpeedKmh)),formatDist(d),`${i.usedSpeedKmh.toFixed(1)} km/h`);
}

function upsertNodoFijoMarker(lat,lon) {

    nodoFijoMarker=L.marker([lat,lon],{icon:stopIcon}).addTo(map);
    nodoFijoMarker.bindPopup(buildNodoFijoPopupHtml(0));

  } else nodoFijoMarker.setLatLng([lat,lon]);
}

// ─── Estado bus ───────────────────────────────────────────────
function setBusMovingState(isMoving) {
  if(busIsMoving===isMoving) return;
  busIsMoving=isMoving;
  const ae=busMarker.getElement(), ar=ae&&ae.firstChild;
  if(ar){ ar.classList.toggle("moving",isMoving); ar.classList.toggle("stopped",!isMoving); }
  const el=document.getElementById("busState");
  if(el){
    el.classList.toggle("moving", isMoving);
    el.classList.toggle("stopped",!isMoving);
    el.textContent=isMoving?"Movimiento":"Detenido";
  }
}

// ─── Aplica datos a UI y mapa ─────────────────────────────────
function applyBusDataToUIAndMap(d) {
  const lat=Number(d.lat||0),lon=Number(d.lon||0);
  if(!lat||!lon) return null;
  const rawSpeedKmh =Number(d.speed_kmh||0);
  const usedSpeedKmh=pickSpeedKmh(rawSpeedKmh);
  document.getElementById("hora").textContent=d.hora_ecuador??"--";
  setBusMovingState(rawSpeedKmh>=MOVING_KMH);
  const busPos=snapPos||[lat,lon];   // la cámara sigue la posición ajustada a la calle
  if(!lastLatLng) progView(()=>map.setView(busPos,17,{animate:false}));
  else if(followEnabled) progView(()=>map.panTo(busPos,{animate:false}));
  lastLatLng=busPos;
  const ph=buildBusPopupHtml(rawSpeedKmh,busIsMoving);
  if(busMarker.getPopup()) busMarker.setPopupContent(ph);
  else busMarker.bindPopup(ph);
  return {lat,lon,rawSpeedKmh,usedSpeedKmh};
}

// ─── Loop 3 s ─────────────────────────────────────────────────
let activeSolicitudPopupKey = null;

let _lastTickAt=0, _tickT=null;
function scheduleTick(){   // procesa cada dato al llegar (máx. 1 por segundo) para que la línea vaya en tiempo real
  const w=GRAPH_MS-(Date.now()-_lastTickAt);
  if(w<=0) busTick();
  else if(!_tickT) _tickT=setTimeout(()=>{ _tickT=null; busTick(); },w);
}
function busTick(){
  _lastTickAt=Date.now();
  if(!latestBusData) return;
  const info=applyBusDataToUIAndMap(latestBusData);
  if(!info) return;
  lastBusInfo=info;

  // ✅ Pasar velocidad cruda al trail para que detecte reposo
  updateGreenTrailForced(info.lat, info.lon, info.rawSpeedKmh);

  // Contenedores / NodoFijo
  if(activeStopId){
    if(activeStopId===NODO_FIJO_ID&&nodoFijoMarker){
      nodoFijoMarker.setPopupContent(buildNodoFijoPopupHtml(info.usedSpeedKmh));
    } else {
      const s=stops.find(x=>x.id===activeStopId);
      const m=stopMarkers.get(activeStopId);
      if(s&&m) m.setPopupContent(stopPopupHtml(s));
    }
  }

  if(busMarker.isPopupOpen())
    busMarker.setPopupContent(buildBusPopupHtml(info.rawSpeedKmh,busIsMoving));

  if(activeSolicitudPopupKey){
    const item=marcadoresActivos.get(activeSolicitudPopupKey);
    if(item && item.marker.isPopupOpen()){
      item.marker.setPopupContent(solicitudPopupHtml(activeSolicitudPopupKey,item.esMio,item.color,item.lat,item.lon));
    } else {
      activeSolicitudPopupKey=null;
    }
  }
}
setInterval(busTick,GRAPH_MS);   // forzado cada 0.5 s
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) busTick(); });

// ═══════════════════════════════════════════════════════════════
// ─── Solicitudes compartidas en tiempo real (Firebase) ────────
// ═══════════════════════════════════════════════════════════════
const SOLICITUD_TTL_MS = 10 * 60 * 1000;
const solicitudesRef   = ref(db, "Solicitudes");

const marcadoresActivos = new Map();

const COLORES_POOL = [
  "#e74c3c","#e67e22","#f1c40f","#2ecc71","#1abc9c",
  "#3498db","#9b59b6","#e91e63","#00bcd4","#ff5722",
  "#8bc34a","#ff9800","#673ab7","#009688","#f44336",
  "#cddc39","#03a9f4","#ff4081","#76ff03","#40c4ff"
];
function colorForKey(key) {
  let hash=0;
  for(let i=0;i<key.length;i++) hash=(hash*31+key.charCodeAt(i))>>>0;
  return COLORES_POOL[hash % COLORES_POOL.length];
}

function formatCountdown(ms) {
  if(ms<=0) return "0:00";
  const s=Math.ceil(ms/1000);
  const m=Math.floor(s/60), ss=s%60;
  return `${m}:${String(ss).padStart(2,"0")}`;
}

function dibujarSolicitudEnMapa(fbKey, data) {
  if(marcadoresActivos.has(fbKey)) return;

  const { lat, lon, expireAt, uid } = data;
  const remaining = expireAt - Date.now();
  if(remaining <= 0) return;

  const color  = colorForKey(fbKey);
  const esMio  = (uid === MY_UID);

  const html = `
    <div style="position:relative;width:52px;height:52px;">
      <div class="solicitud-ring" style="background:${color};top:50%;left:50%;"></div>
      <div class="solicitud-core" style="background:${color};top:50%;left:50%;"></div>
      <div class="solicitud-timer" id="stimer-${fbKey}">
        ${formatCountdown(remaining)}
      </div>
    </div>`;

  const icon = L.divIcon({
    className:"", html,
    iconSize:[52,52], iconAnchor:[26,26]
  });

  const marker = L.marker([lat,lon],{icon,zIndexOffset:500}).addTo(map);

  marker.bindPopup(solicitudPopupHtml(fbKey, esMio, color, lat, lon));

  marker.on("popupopen", ()=>{
    activeSolicitudPopupKey = fbKey;
    pauseFollowFor();
    marker.setPopupContent(solicitudPopupHtml(fbKey, esMio, color, lat, lon));
  });
  marker.on("popupclose", ()=>{
    if(activeSolicitudPopupKey === fbKey) activeSolicitudPopupKey = null;
  });

  const tickerId = setInterval(()=>{
    const rem = expireAt - Date.now();
    const el  = document.getElementById(`stimer-${fbKey}`);
    if(el) el.textContent = formatCountdown(rem);
    if(rem <= 0) clearInterval(tickerId);
  },1000);

  const autoExpire = setTimeout(()=>{ quitarMarcador(fbKey); }, remaining+500);

  marcadoresActivos.set(fbKey, { marker, tickerId, autoExpire, lat, lon, esMio, color });
}

function quitarMarcador(fbKey) {
  const item = marcadoresActivos.get(fbKey);
  if(!item) return;
  marcadoresActivos.delete(fbKey);
  clearInterval(item.tickerId);
  clearTimeout(item.autoExpire);
  if(map.hasLayer(item.marker)) map.removeLayer(item.marker);
  if(activeSolicitudPopupKey===fbKey) activeSolicitudPopupKey=null;
}

onValue(solicitudesRef, snap => {
  const data = snap.val() || {};
  const claves = new Set(Object.keys(data));
  for(const [k,v] of Object.entries(data)){
    if(!marcadoresActivos.has(k)) dibujarSolicitudEnMapa(k, v);
  }
  for(const k of marcadoresActivos.keys()){
    if(!claves.has(k)) quitarMarcador(k);
  }
});

setInterval(async ()=>{
  try {
    const snap = await new Promise(res=>onValue(solicitudesRef,res,{onlyOnce:true}));
    const data = snap.val()||{};
    for(const [k,v] of Object.entries(data)){
      if(v.uid === MY_UID && v.expireAt <= Date.now()){
        await remove(ref(db,`Solicitudes/${k}`));
      }
    }
  } catch(e){}
},30000);

async function crearSolicitud(lat, lon) {
  const expireAt = Date.now() + SOLICITUD_TTL_MS;
  const newRef   = push(solicitudesRef);
  await set(newRef, { lat, lon, expireAt, uid: MY_UID });
  showToast("✅ Punto Agregado", 3000);
}

window._cancelarSolicitud = async function(fbKey) {
  map.closePopup();
  await remove(ref(db,`Solicitudes/${fbKey}`));
};

let drawMode=false;
const btnDibujar = document.getElementById("btnDibujar");
const drawHint   = document.getElementById("drawHint");
const mapEl      = document.getElementById("map");

function setDraw(on) {
  drawMode=on;
  btnDibujar.textContent=on?"📊 Cancelar":"📊 Calcular";
  mapEl.classList.toggle("draw-mode",on);
  drawHint.style.display=on?"block":"none";
  map.dragging[on?"disable":"enable"]();
  map.scrollWheelZoom[on?"disable":"enable"]();
  if(on) pauseFollowFor();
}

btnDibujar.addEventListener("click", ()=>setDraw(!drawMode));

map.on("click", async e=>{
  if(!drawMode) return;
  setDraw(false);
  await crearSolicitud(e.latlng.lat, e.latlng.lng);
});

window.addEventListener("keydown", e=>{ if(e.key==="Escape"&&drawMode) setDraw(false); });
</script>
